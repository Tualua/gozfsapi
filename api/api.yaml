openapi: "3.0.3"
info:
  title: Go Simple ZFS Api
  version: "1.0"
servers:
  - url: http://localhost:8080
paths:
  /readyz:
    get:
      responses:
        "200":
          description: Service is ready
  /zfs/list:
    get:
      summary: List ZFS datasets
      operationId: listZfsDatasets
      parameters:
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ZFSDatasetType"
      responses:
        "200":
          description: A list of ZFS datasets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ZFSDataset"
  /zfs/create:
    post:
      summary: Create a ZFS dataset
      operationId: createZfsDataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/ZFSCreateDatasetFsProps"
                - $ref: "#/components/schemas/ZFSCreateDatasetVolProps"
      responses:
        "201":
          description: Dataset created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZFSDataset"
        "400":
          description: Bad request, invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict, dataset already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /zfs/clone:
    post:
      summary: Clone a ZFS dataset
      operationId: cloneZfsDataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZFSCloneReq"
      responses:
        "201":
          description: Dataset cloned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZFSDataset"
        "404":
          description: Source dataset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad request, invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict, target dataset already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Bad request, invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /zfs/destroy:
    post:
      summary: Destroy a ZFS dataset
      operationId: destroyZfsDataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Name of the dataset to destroy
                force:
                  type: boolean
                  default: false
                  description: Forcibly unmount file systems. This option has no effect on non-file systems or unmounted file systems.
                recursive:
                  type: boolean
                  default: false
                  description: Recursively destroy all dependents, including cloned file systems outside the target hierarchy.
                children:
                  type: boolean
                  default: false
                  description: Recursively destroy all children.
      responses:
        "204":
          description: Dataset destroyed successfully
        "404":
          description: Dataset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Bad request, invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        
  # /zfs/get:
  #   get:
  #     summary: Get ZFS datasets
  #     operationId: getZfsDatasets
  #     requestBody:
  #       required: true
  #       content:
  #         application/json:
  #           schema:
  #             $ref: "#/components/schemas/ZFSDatasetGetReq"
  #     responses:
  #       "404":
  #         description: Dataset not found
  #         content:
  #           application/json:
  #             schema:
  #               $ref: "#/components/schemas/ErrorResponse"
  #       "200":
  #         description: A list of ZFS datasets
  #         content:
  #           application/json:
  #             schema:
  #               $ref: "#/components/schemas/ZFSDatasetGetResp"
components:
  schemas:
    ZFSCloneReq:
      type: object
      required:
        - source
        - target
      properties:
        source:
          type: string
          description: Source dataset to clone from
        target:
          type: string
          description: Target dataset name for the clone
    ZFSDatasetType:
      type: string
      default: all
      enum:
        - filesystem
        - snapshot
        - volume
        - bookmark
        - all
    ZFSDatasetProp:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
          description: Name of the dataset property
        value:
          type: string
          description: Value of the dataset property
    ZFSDatasetGetReq:
      type: object
      required:
        - name
        - properties
      properties:
        name:
          type: string
          description: Name of dataset to retrieve
        properties:
          type: array
          items:
            type: string
          description: List of properties to retrieve for the dataset
    ZFSDatasetGetResp:
      type: object
      required:
        - properties
      properties:
        properties:
          type: array
          items:
            $ref: "#/components/schemas/ZFSDatasetProp"
    ZFSDataset:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        used:
          type: string
        available:
          type: string
        mountpoint:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
    ZFSCreateDatasetCommonProps:
      type: object
      required:
        - name
      description: Common properties for creating ZFS datasets
      properties:
        name:
          type: string
          description: Name of the dataset to create
        recursive:
          type: boolean
          default: false
          description: Creates all the non-existing parent datasets
        properties:
          type: array
          items:
            $ref: "#/components/schemas/ZFSDatasetProp"
    ZFSCreateDatasetVolProps:
      allOf:
        - $ref: "#/components/schemas/ZFSCreateDatasetCommonProps"
        - type: object
          required:
            - volsize
          properties:
            blocksize:
              type: string
              default: 8K
              description: Block size for the volume-type dataset, e.g., "128K", "256K", etc.
            volsize:
              type: string
              description: Size of the volume-type dataset, e.g., "10G", "100M", etc.
            sparse:
              type: boolean
              default: false
              description: Creates a sparse volume with no reservation
    ZFSCreateDatasetFsProps:
      allOf:
        - $ref: "#/components/schemas/ZFSCreateDatasetCommonProps"
        - type: object
          properties:
            mount:
              type: boolean
              default: true
              description: Mount the dataset at its default mountpoint